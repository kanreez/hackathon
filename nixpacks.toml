# How kuso builds and runs this repo (nixpacks). One service, "bodom":
# builds the web version of the app into dist/, then the Express server (server/server.js)
# serves that and the API from https://bodom.junioraccelerator.org.
#
# The build needs EXPO_PUBLIC_SUPABASE_URL and EXPO_PUBLIC_SUPABASE_ANON_KEY (same values as
# the root .env): set them on the kuso service. The server reads server/.env.

[variables]
NIXPACKS_NODE_VERSION = "22"

[phases.build]
cmds = ["npx expo export --platform web"]

[start]
cmd = "node server/server.js"
